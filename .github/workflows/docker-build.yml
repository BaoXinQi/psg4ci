name: Docker Build Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -lah
          find . -maxdepth 2 -type f | sort | head -200

      - name: Build Docker image
        run: |
          docker build -t psg4ci-test .
          docker run --rm psg4ci-test python -c "import torch, pyedflib, edfio, sklearn, h5py, pandas, numpy; print('IMPORT_OK')"
          docker run --rm -i psg4ci-test python - <<'PY'
          from pathlib import Path

          from raw_sequence_runtime import load_runtime
          from team_code import run_model

          model = load_runtime(Path("pretrained_raw"), threads=1)
          assert len(model["sequences"]) == 3

          try:
              run_model(
                  model,
                  {"BidsFolder": "missing-smoke", "SiteID": "I0004", "SessionID": 1},
                  "/missing",
                  False,
              )
          except FileNotFoundError as exc:
              assert "Could not find physiological_data" in str(exc)
          else:
              raise AssertionError("Missing physiological input was not rejected")

          print("MODEL_LOAD_AND_INPUT_GUARD_OK")
          PY
