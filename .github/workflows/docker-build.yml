name: Docker Build Test

on:
  workflow_dispatch:
  push:
    branches: [ main, master, candidate/v16-v14-edf-date-fallback ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -lah
          find . -maxdepth 2 -type f | sort | head -200

      - name: Build Docker image
        run: |
          docker build -t psg4ci-test .
          docker run --rm psg4ci-test python -c "import torch, pyedflib, edfio, sklearn, h5py, pandas, numpy; print('IMPORT_OK')"
          docker run --rm -i psg4ci-test python - <<'PY'
          import hashlib
          import json
          import math
          import tempfile
          from datetime import datetime
          from pathlib import Path

          import numpy as np
          import online_features
          from pyedflib import highlevel
          from raw_sequence_runtime import load_runtime
          from team_code import (
              _caisr_adjustment,
              _date_adjustment,
              _followup_adjustment,
              _runtime_creation_time,
              run_model,
          )

          model = load_runtime(Path("pretrained_raw"), threads=1)
          assert len(model["sequences"]) == 3
          date_rule = json.loads(Path("pretrained_raw/date_residual.json").read_text())
          caisr_rule = json.loads(Path("pretrained_raw/caisr_residual.json").read_text())
          followup_rule = json.loads(
              Path("pretrained_raw/followup_residual.json").read_text()
          )
          model["date_rule"] = date_rule
          model["caisr_rule"] = caisr_rule
          model["followup_rule"] = followup_rule
          metadata = json.loads(Path("pretrained_raw/metadata.json").read_text())
          for filename, expected in metadata["files"].items():
              path = Path("pretrained_raw") / filename
              actual_size = path.stat().st_size
              actual_sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual_size == expected["bytes"], (
                  filename,
                  actual_size,
                  expected["bytes"],
              )
              assert actual_sha256 == expected["sha256"], (
                  filename,
                  actual_sha256,
                  expected["sha256"],
              )
          assert len(caisr_rule["columns"]) == 90
          assert len(caisr_rule["feature_coefficients"]) == 90
          assert _date_adjustment(date_rule, {"CreationTime": None}) == 0.0
          assert _followup_adjustment(followup_rule, {"CreationTime": None}) == 0.0
          adjustment, status = _caisr_adjustment(
              caisr_rule, Path("/missing.edf"), None, "missing-smoke"
          )
          assert adjustment == 0.0 and status == "missing"

          original_extractor = online_features.extract_caisr_features
          online_features.extract_caisr_features = lambda *args, **kwargs: {
              "caisr_file_available": 1.0,
              "caisr_stage_valid_epoch_fraction": 0.0,
              "caisr_stage_probability_valid_epoch_fraction": 0.0,
              "caisr_arousal_valid_epoch_fraction": 0.0,
              "caisr_respiratory_valid_epoch_fraction": 0.0,
              "caisr_limb_valid_epoch_fraction": 0.0,
          }
          adjustment, status = _caisr_adjustment(
              caisr_rule, Path("/present.edf"), Path("/invalid.edf"), "invalid-smoke"
          )
          online_features.extract_caisr_features = original_extractor
          assert adjustment == 0.0 and status == "invalid"

          binary, probability = run_model(
              model,
              {
                  "BidsFolder": "missing-smoke",
                  "SiteID": "I0004",
                  "SessionID": 1,
                  "CreationTime": "2013-11-13 21:15:35",
              },
              "/missing",
              False,
          )
          assert isinstance(binary, bool) and math.isfinite(probability)

          with tempfile.TemporaryDirectory() as temporary:
              data_root = Path(temporary)
              psg_dir = data_root / "physiological_data" / "I0004"
              psg_dir.mkdir(parents=True)
              psg_path = psg_dir / "sub-ci-smoke_ses-1.edf"
              signal_headers = highlevel.make_signal_headers(
                  ["EEG"], sample_frequency=1
              )
              header = highlevel.make_header(
                  startdate=datetime(2020, 1, 2, 3, 4, 5)
              )
              highlevel.write_edf(
                  str(psg_path),
                  [np.zeros(1, dtype=float)],
                  signal_headers,
                  header,
              )
              value, source = _runtime_creation_time(
                  {"CreationTime": None}, psg_path
              )
              assert source == "edf-header"
              assert value == datetime(2020, 1, 2, 3, 4, 5)
              explicit, source = _runtime_creation_time(
                  {"CreationTime": "2019-02-03 04:05:06"}, psg_path
              )
              assert source == "metadata"
              assert explicit == "2019-02-03 04:05:06"
              binary, probability = run_model(
                  model,
                  {
                      "BidsFolder": "sub-ci-smoke",
                      "SiteID": "I0004",
                      "SessionID": 1,
                      "CreationTime": None,
                  },
                  data_root,
                  False,
              )
              assert isinstance(binary, bool) and math.isfinite(probability)

          print("MODEL_LOAD_SHORT_RECORD_AND_EDF_DATE_FALLBACK_OK")
          PY
